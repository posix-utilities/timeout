# Generated from monorel's goreleaser template, narrowed to supported targets.
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: timeout
    binary: timeout
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Env.VERSION}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    targets:
      - aix_ppc64
      - android_arm64_v8.0
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - dragonfly_amd64_v1
      - freebsd_386_sse2
      - freebsd_amd64_v1
      - freebsd_arm_v6
      - freebsd_arm_v7
      - freebsd_arm64_v8.0
      - illumos_amd64_v1
      - linux_386_sse2
      - linux_amd64_v1
      - linux_arm_v6
      - linux_arm_v7
      - linux_arm64_v8.0
      - linux_loong64
      - linux_ppc64
      - linux_ppc64le
      - linux_riscv64
      - linux_s390x
      - netbsd_386_sse2
      - netbsd_amd64_v1
      - netbsd_arm_v6
      - netbsd_arm_v7
      - netbsd_arm64_v8.0
      - openbsd_386_sse2
      - openbsd_amd64_v1
      - openbsd_arm_v6
      - openbsd_arm_v7
      - openbsd_arm64_v8.0
      - openbsd_ppc64
      - openbsd_riscv64
      - solaris_amd64_v1
    main: .

  - id: timeout-windows
    binary: timeout
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Env.VERSION}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    targets:
      - windows_386_sse2
      - windows_amd64_v1
      - windows_arm64_v8.0
    main: .

archives:
  - id: timeout
    ids:
      - timeout
      - timeout-windows
    formats:
      - tar.gz
      - tar.zst
    name_template: >-
      timeout_{{ .Env.VERSION }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
          - tar.gz

checksum:
  name_template: timeout_{{ .Env.VERSION }}_checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Publishing is handled by monorel so prefixed tags remain supported.
release:
  disable: true
